# ============================================================================
# CPhOS AI 命题系统 —— nginx 反向代理
# ----------------------------------------------------------------------------
# * /api/*、/docs、/redoc、/openapi.json、/health、/version 反代到后端。
# * SSE 进度推送（GET /api/tasks/{id}/events）需关闭缓冲并放长超时。
# * 可选：把前端静态资源放在 /usr/share/nginx/html 由 location / 直接服务。
# ============================================================================

upstream cphos_api {
    server api:8000;
    keepalive 32;
}

# 反代通用头（HTTP/1.1 + keepalive 复用上游连接）。
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

server {
    listen 80;
    server_name _;

    # 文件上传端点（/api/tasks/upload）需要较大请求体；按需调整。
    client_max_body_size 32m;

    # ---- SSE 实时进度：必须关闭代理缓冲、放长读超时 ----
    location ~ ^/api/tasks/[^/]+/events$ {
        proxy_pass http://cphos_api;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # ---- 其余 API 与系统端点 ----
    location /api/ {
        proxy_pass http://cphos_api;
        proxy_set_header Connection "";
        # 生成任务可能长时间无响应（数分钟）；放宽读超时。
        proxy_read_timeout 600s;
    }

    location = /health  { proxy_pass http://cphos_api; proxy_set_header Connection ""; }
    location = /version { proxy_pass http://cphos_api; proxy_set_header Connection ""; }

    # OpenAPI 文档（FastAPI 默认 /docs、/redoc、/openapi.json）。
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://cphos_api;
        proxy_set_header Connection "";
    }

    # ---- 可选：前端单页应用静态托管 ----
    # 在 docker-compose.yml 中把前端 dist 挂到 /usr/share/nginx/html 后启用。
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}

# ---- 可选：TLS 终止（启用后把上面的 listen 80 改为 301 跳转到 https）----
