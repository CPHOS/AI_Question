    <script id="openapi-spec" type="application/json">{"openapi": "3.1.0", "info": {"title": "CPhOS 物理竞赛题生成 API", "description": "\nCPhOS 物理竞赛题全自动生成系统的后端 API。\n\n## 鉴权\n所有 `/api/**` 端点需在 `Authorization: Bearer <token>` 头中携带 token。\ntoken 由管理员通过 `/api/admin/tokens` 签发，明文仅创建时返回一次。\n\n## 异步工作流\n1. `POST /api/tasks` 提交任务，立即获得 `task_id`；\n2. 轮询 `GET /api/tasks/{task_id}` 直到 `status` 变为 `done` / `error` / `aborted`；\n3. 通过 `GET /api/tasks/{task_id}/artifacts` 与下载端点获取产物。\n", "version": "0.1.0"}, "paths": {"/health": {"get": {"tags": ["system"], "summary": "健康检查", "description": "无需鉴权的健康检查端点。", "operationId": "health_health_get", "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MessageResponse"}}}}}}}, "/api/tasks": {"post": {"tags": ["tasks"], "summary": "提交生成任务", "description": "提交一个异步生成任务，立即返回 ``task_id``；通过轮询获取进度与结果。", "operationId": "create_task_api_tasks_post", "security": [{"HTTPBearer": []}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/GenerateRequest"}}}}, "responses": {"202": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TaskCreated"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}, "get": {"tags": ["tasks"], "summary": "列出当前用户的任务历史", "description": "分页列出调用者自己的历史任务（按创建时间倒序）。", "operationId": "list_my_tasks_api_tasks_get", "security": [{"HTTPBearer": []}], "parameters": [{"name": "limit", "in": "query", "required": false, "schema": {"type": "integer", "default": 50, "title": "Limit"}}, {"name": "offset", "in": "query", "required": false, "schema": {"type": "integer", "default": 0, "title": "Offset"}}], "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/TaskListItem"}, "title": "Response List My Tasks Api Tasks Get"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/api/tasks/upload": {"post": {"tags": ["tasks"], "summary": "上传源材料并提交改编任务", "description": "上传源材料文件（对应 CLI ``--adapt``）并提交改编任务。", "operationId": "create_task_upload_api_tasks_upload_post", "requestBody": {"content": {"multipart/form-data": {"schema": {"$ref": "#/components/schemas/Body_create_task_upload_api_tasks_upload_post"}}}, "required": true}, "responses": {"202": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TaskCreated"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}, "security": [{"HTTPBearer": []}]}}, "/api/tasks/{task_id}": {"get": {"tags": ["tasks"], "summary": "查询任务状态与摘要", "description": "返回任务状态及完成后的摘要（裁决、token 用量、产物清单等）。", "operationId": "get_task_status_api_tasks__task_id__get", "security": [{"HTTPBearer": []}], "parameters": [{"name": "task_id", "in": "path", "required": true, "schema": {"type": "string", "title": "Task Id"}}], "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TaskStatus"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}, "delete": {"tags": ["tasks"], "summary": "删除任务及其产物", "description": "删除任务元数据与磁盘产物。运行中的任务不会被中断，仅清理记录。", "operationId": "delete_task_api_tasks__task_id__delete", "security": [{"HTTPBearer": []}], "parameters": [{"name": "task_id", "in": "path", "required": true, "schema": {"type": "string", "title": "Task Id"}}], "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MessageResponse"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/api/tasks/{task_id}/progress": {"get": {"tags": ["tasks"], "summary": "查询任务的节点级进度", "description": "返回任务的阶段事件时间线，含每个已完成阶段的结构化产出快照。\n\n可在轮询任务期间调用，用于展示当前所处节点与各阶段的格式化结果\n（非模型原始输出）。", "operationId": "get_task_progress_api_tasks__task_id__progress_get", "security": [{"HTTPBearer": []}], "parameters": [{"name": "task_id", "in": "path", "required": true, "schema": {"type": "string", "title": "Task Id"}}], "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TaskProgress"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/api/tasks/{task_id}/artifacts": {"get": {"tags": ["tasks"], "summary": "列出任务产物", "description": "列出任务产物文件及其大小。", "operationId": "list_task_artifacts_api_tasks__task_id__artifacts_get", "security": [{"HTTPBearer": []}], "parameters": [{"name": "task_id", "in": "path", "required": true, "schema": {"type": "string", "title": "Task Id"}}], "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/ArtifactInfo"}, "title": "Response List Task Artifacts Api Tasks  Task Id  Artifacts Get"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/api/tasks/{task_id}/artifacts/{name}": {"get": {"tags": ["tasks"], "summary": "下载单个产物", "description": "下载指定产物文件（如 ``final_latex`` / ``log`` / ``assets/fig1.pdf``）。", "operationId": "download_artifact_api_tasks__task_id__artifacts__name__get", "security": [{"HTTPBearer": []}], "parameters": [{"name": "task_id", "in": "path", "required": true, "schema": {"type": "string", "title": "Task Id"}}, {"name": "name", "in": "path", "required": true, "schema": {"type": "string", "title": "Name"}}], "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/api/tasks/{task_id}/result": {"get": {"tags": ["tasks"], "summary": "内联返回关键文本结果", "description": "内联返回最终 LaTeX 与仲裁报告文本，便于直接消费。", "operationId": "get_task_result_api_tasks__task_id__result_get", "security": [{"HTTPBearer": []}], "parameters": [{"name": "task_id", "in": "path", "required": true, "schema": {"type": "string", "title": "Task Id"}}], "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TaskResult"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/api/admin/users": {"get": {"tags": ["admin"], "summary": "列出用户", "description": "列出全部用户。", "operationId": "list_users_api_admin_users_get", "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"items": {"$ref": "#/components/schemas/UserInfo"}, "type": "array", "title": "Response List Users Api Admin Users Get"}}}}}, "security": [{"HTTPBearer": []}]}, "post": {"tags": ["admin"], "summary": "创建用户", "description": "创建一个新用户（随后可为其签发 token）。", "operationId": "create_user_api_admin_users_post", "requestBody": {"content": {"application/json": {"schema": {"$ref": "#/components/schemas/CreateUserRequest"}}}, "required": true}, "responses": {"201": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/UserInfo"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}, "security": [{"HTTPBearer": [
